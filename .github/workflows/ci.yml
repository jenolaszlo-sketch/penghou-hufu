name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore pinned experimental test dependency
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Restore-BiscuitCandidate.ps1
      - name: Windows full regression suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet test Penghou.Hufu.slnx -c Release -m:1 --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Full regression suite failed.' }
          ./eng/Verify-HufuCoreGraph.ps1
          ./eng/Test-LocalHost.ps1
      - name: Linux and macOS portable core and workflow suites
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: pwsh
        run: |
          dotnet test tests/Penghou.Hufu.Tests/Penghou.Hufu.Tests.csproj -c Release --filter 'FullyQualifiedName~BoundedAuthorityRequestAuthorizerTests|FullyQualifiedName~AuthorityIssuanceProfileTests|FullyQualifiedName~AuthorityIssuanceStoreTests|FullyQualifiedName~AuthorityExplanationReaderTests|FullyQualifiedName~AuthorityExplanationCedarTests|FullyQualifiedName~AuthorityTelemetryTests|FullyQualifiedName~HufuLanguageV2AuthorizerTests' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Portable core security/explanation/telemetry tests failed.' }
          dotnet test tests/Penghou.Hufu.Workflow.Tests/Penghou.Hufu.Workflow.Tests.csproj -c Release --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Portable adapter tests failed.' }
          dotnet test tests/Penghou.Hufu.Workflow.Integration.Tests/Penghou.Hufu.Workflow.Integration.Tests.csproj -c Release --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Published-runtime integration tests failed.' }
          dotnet test tests/Penghou.Hufu.Luban.Sqlite.Tests/Penghou.Hufu.Luban.Sqlite.Tests.csproj -c Release --filter 'FullyQualifiedName!~HufuSinglePatchHostTests' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Portable patch journal tests failed.' }
      - name: macOS native Cedar, Biscuit and SQLite regression
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne [System.Runtime.InteropServices.Architecture]::Arm64) { throw 'Native macOS qualification requires ARM64.' }
          dotnet test tests/Penghou.Hufu.Tests/Penghou.Hufu.Tests.csproj -c Release --filter '(FullyQualifiedName~CedarAuthorityEvaluatorTests|FullyQualifiedName~SqliteAuthorityStoreTests)&FullyQualifiedName!~CurrentSourceAndDecisionRecorderCompleteRealCedarLubanRead&FullyQualifiedName!~FailedRequiredDurableRecorderBlocksRealLubanRead' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Native Cedar/SQLite tests failed.' }
          dotnet test tests/Penghou.Hufu.Biscuit.Tests/Penghou.Hufu.Biscuit.Tests.csproj -c Release --filter 'FullyQualifiedName!~BiscuitLubanReadTests&FullyQualifiedName!~BiscuitResourceReadTests' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Native Biscuit/Cedar/SQLite tests failed.' }
      - name: Pack and inspect release packages using only public dependencies
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = "$($props.Project.PropertyGroup[0].Version)-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          ./eng/Pack-HufuRelease.ps1 -Version $version
          ./eng/Test-HufuPackageConsumers.ps1 -PackageDirectory artifacts/packages -Version $version
          ./eng/Test-PackagedWorkflowIntegration.ps1 -PackageDirectory artifacts/packages -Version $version
          ./eng/Test-PackagedPatchIntegration.ps1 -PackageDirectory artifacts/packages -Version $version
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hufu-qualification-${{ matrix.os }}
          path: |
            test-results/*.trx
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/package-inspection.json
            qualification/**/qualification.json
            qualification/**/tests/*.trx
          if-no-files-found: warn
