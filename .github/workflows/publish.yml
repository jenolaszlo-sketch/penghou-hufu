name: Publish to NuGet
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hufu-nuget-publication
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require manual main publication
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish must be dispatched from main.' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore pinned experimental test dependency
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Restore-BiscuitCandidate.ps1
      - name: Windows full regression suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet test Penghou.Hufu.slnx -c Release -m:1 --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Full regression suite failed.' }
          ./eng/Verify-HufuCoreGraph.ps1
          ./eng/Test-LocalHost.ps1
      - name: Linux and macOS portable core and workflow suites
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: pwsh
        run: |
          dotnet test tests/Penghou.Hufu.Tests/Penghou.Hufu.Tests.csproj -c Release --filter 'FullyQualifiedName~BoundedAuthorityRequestAuthorizerTests|FullyQualifiedName~AuthorityIssuanceProfileTests|FullyQualifiedName~AuthorityIssuanceStoreTests|FullyQualifiedName~AuthorityExplanationReaderTests|FullyQualifiedName~AuthorityExplanationCedarTests|FullyQualifiedName~AuthorityTelemetryTests|FullyQualifiedName~HufuLanguageV2AuthorizerTests' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Portable core security/explanation/telemetry tests failed.' }
          dotnet test tests/Penghou.Hufu.Workflow.Tests/Penghou.Hufu.Workflow.Tests.csproj -c Release --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Portable adapter tests failed.' }
          dotnet test tests/Penghou.Hufu.Workflow.Integration.Tests/Penghou.Hufu.Workflow.Integration.Tests.csproj -c Release --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Published-runtime integration tests failed.' }
          dotnet test tests/Penghou.Hufu.Luban.Sqlite.Tests/Penghou.Hufu.Luban.Sqlite.Tests.csproj -c Release --filter 'FullyQualifiedName!~HufuSinglePatchHostTests' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Portable patch journal tests failed.' }
      - name: macOS native Cedar, Biscuit and SQLite regression
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne [System.Runtime.InteropServices.Architecture]::Arm64) { throw 'Native macOS qualification requires ARM64.' }
          dotnet test tests/Penghou.Hufu.Tests/Penghou.Hufu.Tests.csproj -c Release --filter '(FullyQualifiedName~CedarAuthorityEvaluatorTests|FullyQualifiedName~SqliteAuthorityStoreTests)&FullyQualifiedName!~CurrentSourceAndDecisionRecorderCompleteRealCedarLubanRead&FullyQualifiedName!~FailedRequiredDurableRecorderBlocksRealLubanRead' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Native Cedar/SQLite tests failed.' }
          dotnet test tests/Penghou.Hufu.Biscuit.Tests/Penghou.Hufu.Biscuit.Tests.csproj -c Release --filter 'FullyQualifiedName!~BiscuitLubanReadTests&FullyQualifiedName!~BiscuitResourceReadTests' --logger trx --results-directory test-results
          if ($LASTEXITCODE -ne 0) { throw 'Native Biscuit/Cedar/SQLite tests failed.' }
      - name: Qualify exact selected package artifacts
        shell: pwsh
        run: |
          ./eng/Pack-HufuRelease.ps1
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup[0].Version
          ./eng/Test-HufuPackageConsumers.ps1 -PackageDirectory artifacts/packages -Version $version
          ./eng/Test-PackagedWorkflowIntegration.ps1 -PackageDirectory artifacts/packages -Version $version
          ./eng/Test-PackagedPatchIntegration.ps1 -PackageDirectory artifacts/packages -Version $version
      - name: Upload validated package bytes
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/package-inspection.json
          if-no-files-found: error
      - name: Retain release qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-${{ matrix.os }}-${{ github.sha }}
          path: |
            test-results/*.trx
            artifacts/packages/package-inspection.json
            qualification/**/qualification.json
            qualification/**/tests/*.trx
          if-no-files-found: warn
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ github.sha }}
          path: artifacts/packages
      - name: Select immutable release recovery
        id: release
        shell: pwsh
        run: |
          $report = Get-Content artifacts/packages/package-inspection.json -Raw | ConvertFrom-Json
          if ($report.Status -ne 'passed' -or $report.Packages.Count -ne 7) { throw 'Invalid package qualification manifest.' }
          $versions = @($report.Packages.Version | Select-Object -Unique)
          if ($versions.Count -ne 1) { throw 'Release versions must agree.' }
          $originals = @{
            '0.1.0-preview.1' = @{ Run = '37171589215'; Artifact = 'release-packages-3023ddb3fb9d50e01db9a8887f15f02e90cde209' }
            '0.1.0-preview.3' = @{ Run = '37197831939'; Artifact = 'release-packages-3206c4447add6ef0821fb70f118b638598d9aac0' }
          }
          $recover = if ($originals.ContainsKey($versions[0])) { 'true' } else { 'false' }
          "recover=$recover" >> $env:GITHUB_OUTPUT
          "version=$($versions[0])" >> $env:GITHUB_OUTPUT
          if ($recover -eq 'true') {
            "run=$($originals[$versions[0]].Run)" >> $env:GITHUB_OUTPUT
            "artifact=$($originals[$versions[0]].Artifact)" >> $env:GITHUB_OUTPUT
          }
      - name: Recover original published release bytes
        if: steps.release.outputs.recover == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run }}
          name: ${{ steps.release.outputs.artifact }}
          path: artifacts/packages
      - name: Requalify recovered package bytes
        if: steps.release.outputs.recover == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          ./eng/Verify-HufuPackageSet.ps1 -PackageDirectory artifacts/packages -Version $version
          ./eng/Test-HufuSymbolValidation.ps1 -PackageDirectory artifacts/packages -Version $version
          ./eng/Test-HufuPackageConsumers.ps1 -PackageDirectory artifacts/packages -Version $version
          ./eng/Test-PackagedWorkflowIntegration.ps1 -PackageDirectory artifacts/packages -Version $version
          if ($version -ne '0.1.0-preview.1') { ./eng/Test-PackagedPatchIntegration.ps1 -PackageDirectory artifacts/packages -Version $version }
      - name: Verify immutable public packages before any upload
        shell: pwsh
        run: |
          ./eng/Verify-HufuPublishedPackages.ps1 -PackageDirectory artifacts/packages |
            ConvertTo-Json -Depth 8 | Set-Content artifacts/packages/public-package-inspection.json
      - name: Require repository publishing identity
        shell: pwsh
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) { throw 'Configure NUGET_USER in the nuget environment and trust this repository/workflow/environment in NuGet.' }
      - name: NuGet trusted-publisher login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the same validated package and symbol bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $report = Get-Content artifacts/packages/package-inspection.json -Raw | ConvertFrom-Json
          $expectedCount = if (@($report.Packages.Version | Select-Object -Unique) -eq '0.1.0-preview.1') { 6 } else { 7 }
          if ($report.Status -ne 'passed' -or $report.Packages.Count -ne $expectedCount) { throw 'Invalid package qualification manifest.' }
          $public = Get-Content artifacts/packages/public-package-inspection.json -Raw | ConvertFrom-Json
          if ($public.Status -ne 'passed') { throw 'Immutable public package checks did not pass.' }
          foreach ($package in $report.Packages) {
            $extensions = if ($package.Id -in @($public.ExistingPackages)) { @('snupkg') } else { @('nupkg','snupkg') }
            foreach ($extension in $extensions) {
              $path = "artifacts/packages/$($package.Id).$($package.Version).$extension"
              $expected = if ($extension -eq 'nupkg') { $package.Sha256 } else { $package.SymbolSha256 }
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -cne $expected) { throw "Validated artifact hash changed: $path" }
              # A primary-package collision must fail before symbols are sent.
              # Existing releases are skipped only after public-byte verification above.
              $pushOptions = if ($extension -eq 'nupkg') { @('--no-symbols') } else { @('--skip-duplicate') }
              dotnet nuget push $path --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY @pushOptions
              if ($LASTEXITCODE -ne 0) { throw "Publication failed: $path" }
            }
          }
